<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <meta name="theme-color" content="#07112b">

  <title>Dli Air Strike — Plane Shooter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game-shell">

    <canvas id="game"></canvas>

    <section id="hud" class="hud">

      <div class="hud-item">
        <span>SCORE</span>
        <b id="score">0</b>
      </div>

      <div class="hud-item">
        <span>LEVEL</span>
        <b id="level">1</b>
      </div>

      <div class="hud-item">
        <span>LIVES</span>
        <b id="hp">5</b>
      </div>

      <div class="hud-item progress-box">
        <span>PROGRESS</span>
        <b id="progress">0/12</b>
      </div>

      <button id="pauseBtn" class="hud-btn" type="button">
        Ⅱ
      </button>

    </section>

    <section id="startScreen" class="overlay">

      <div class="card">

        <div class="logo-wrap">
          <img src="assets/player.png" alt="Dli Player">
        </div>

        <h1>DLI AIR STRIKE</h1>

        <p>
          Take control, dodge incoming Dli coins
          and shoot them down.
        </p>

        <button id="startBtn" class="primary" type="button">
          START GAME
        </button>

        <p class="hint">
          Desktop: WASD / Arrow Keys + Space<br>
          Mobile: drag to move + FIRE
        </p>

      </div>

    </section>

    <section id="gameOverScreen" class="overlay hidden">

      <div class="card">

        <h2>GAME OVER</h2>

        <p class="result">
          Score: <b id="finalScore">0</b>
        </p>

        <p class="result">
          Level: <b id="finalLevel">1</b>
        </p>

        <button id="restartBtn" class="primary" type="button">
          PLAY AGAIN
        </button>

      </div>

    </section>

    <section id="touchControls" class="touch-controls">

      <div class="move-pad">

        <button type="button" data-dir="up">▲</button>

        <div>
          <button type="button" data-dir="left">◀</button>
          <button type="button" data-dir="down">▼</button>
          <button type="button" data-dir="right">▶</button>
        </div>

      </div>

      <button id="fireBtn" class="fire" type="button">
        FIRE
      </button>

    </section>

  </main>

  <script src="game.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const startScreen =
        document.getElementById("startScreen");

      const gameOverScreen =
        document.getElementById("gameOverScreen");

      const startBtn =
        document.getElementById("startBtn");

      const restartBtn =
        document.getElementById("restartBtn");

      const finalScore =
        document.getElementById("finalScore");

      const finalLevel =
        document.getElementById("finalLevel");

      startBtn.addEventListener("click", () => {

        startScreen.classList.add("hidden");

        if (typeof startGame === "function") {
          startGame();
        }

      });

      restartBtn.addEventListener("click", () => {

        gameOverScreen.classList.add("hidden");

        if (typeof startGame === "function") {
          startGame();
        }

      });

      const originalGameOver =
        window.gameOver;

      window.gameOver = function () {

        if (typeof originalGameOver === "function") {
          originalGameOver();
        }

        finalScore.textContent =
          typeof score !== "undefined"
            ? score
            : 0;

        finalLevel.textContent =
          typeof level !== "undefined"
            ? level
            : 1;

        gameOverScreen.classList.remove("hidden");
      };

    });
  </script>

</body>
</html>
